events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        location / {
            proxy_pass http://frontend:3000/;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://backend:3200/;
            proxy_set_header Host $host;
        }
    }
}