services:
  db2:
    image: icr.io/db2_community/db2
    container_name: db2-test
    platform: linux/amd64
    privileged: true
    restart: unless-stopped
    shm_size: "1gb"

    environment:
      LICENSE: accept
      DB2INSTANCE: ${DB2_USER}
      DB2INST1_PASSWORD: ${DB2_PASSWORD}
      DBNAME: TESTDB
      IS_OSXFS: "true"
      PERSISTENT_HOME: "true"

    ports:
      - "127.0.0.1:50000:50000"

    volumes:
      - db2_data:/database

    networks:
      - wp-net
  backend:
    env_file: ./backend/.env.development.test
    volumes:
      - ./backend/network_data/Sortimentsdaten:/app/daten/Sortimentsdaten
      - ./backend/network_data/Werbung:/app/daten/Werbung
      - ./backend/network_data/Formulare:/app/daten/Formulare
      - ./backend/network_data/Richtlinien:/app/daten/Richtlinien
      - ./backend/network_data/Allgemein:/app/daten/Allgemein

volumes:
  db2_data:

networks:
  wp-net:
